version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-120b}
      - HINDSIGHT_API_URL=${HINDSIGHT_API_URL:-http://hindsight:8888}
      - HINDSIGHT_API_KEY=${HINDSIGHT_API_KEY:-}
      - HINDSIGHT_BANK_ID=${HINDSIGHT_BANK_ID:-memorysec-soc-bank}
      - DATABASE_URL=sqlite:////app/data/memorysec.db
      - APP_ENV=production
    volumes:
      - ./data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
